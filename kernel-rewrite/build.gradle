// download all the needed deps, see https://docs.openrewrite.org/authoring-recipes/multiple-versions
// the recipe-library does not work
tasks.register('downloadDeps', Sync) {
    // create a config for each set of dependencies, this allows to have multiple versions of a dependency
    String configNamePrefix = 'rewrite_'
    configs.each { configName, deps ->
        String config = configNamePrefix + configName
        project.getConfigurations().create(config)

        deps.each {
            project.getDependencies().add(config, it)
        }

        from configurations.named(config)
    }

    // copy all in the same output directory, this must match the directory where rewrite searches for the jars
    into project.layout.buildDirectory.dir("classes/java/test/META-INF/rewrite/classpath").get().asFile
}

tasks.processTestResources.dependsOn(tasks.downloadDeps)

description = "Contains the logic to rewrite (breaking) changes, which can be made automatically, see MGM Wiki Shortlink x/yx6KF"

rewrite {
    activeRecipe('com.mgmtp.a12.kernel.internal.all')
