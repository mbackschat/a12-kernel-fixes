plugins {
    alias libs.plugins.kernelJavaConventions
    alias libs.plugins.lombok
    alias libs.plugins.openrewrite
}

dependencies {
    annotationProcessor libs.lombok

    api testLibs.rewriteJava
    api testLibs.rewriteCore
    api libs.jacksonAnnotations
    api libs.jspecify

    runtimeOnly(testLibs.rewriteJavaDependencies)
    runtimeOnly(testLibs.rewriteJava21)

    testImplementation libs.commonsIo //This is! required transitively by IOUtils4Test (it is detected as obsolete by gradle buildHealth)
    testImplementation(testLibs.junitJupiterApi)
    testImplementation(testLibs.rewriteTest)
    testImplementation(project(':kernel-internal-test-utils')) {
        // we only want to use the IOUtils4Test, so we exclude all dependencies
        transitive = false
    }
    testImplementation project(':kernel-internal-test-tags')

    testRuntimeOnly(testLibs.junitJupiterEngine)

    rewrite files(sourceSets.main.output)
}

configurations.configureEach {
    // disable composite builds (--include-build) for this subproject, because we reference a lot 
    // of specific kernel versions, where we don't want to get a local version (e.g. of 
    // kernel-core-runtime-api) substituted even when --include-build is enabled for the 
    // overall kernel build.
    resolutionStrategy.useGlobalDependencySubstitutionRules = false
}

