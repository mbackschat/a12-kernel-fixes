include(":kernel-internal-core-facade")
include(":kernel-internal-core-ontheflytesting")
include(":kernel-internal-core-parser")
include(":kernel-core-parser-web")
include(":kernel-internal-core-parsetree-api")
include(":kernel-core-runtime-api-ts")
