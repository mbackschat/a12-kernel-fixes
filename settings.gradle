pluginManagement {
    plugins {
        id 'antlr'
    }
}

rootProject.name = "kernel"

// #### configure composite builds ####

// define the include builds if the properties are set
if (providers.gradleProperty('a12.kernel.include.customfieldtype.api').map { it.toBoolean() }.getOrElse(false)) {
    includeBuild 'kernel-core-customfieldtype-api'
}
if (providers.gradleProperty('a12.kernel.include.runtime.api').map { it.toBoolean() }.getOrElse(false)) {
    includeBuild 'kernel-core-runtime-api'
}




// #### helper for artifactIds ####
def A12_kernel_runtime_artifact_id = ((file("gradle/libs.versions.toml").getText("UTF-8") =~
        ~/a12KernelRuntimeArtifactId.*module = "com.mgmtp.a12.kernel:([a-zA-Z0-9-]+).*/)[0][1])


// #### modules ####
include(":${A12_kernel_runtime_artifact_id}")
include(":kernel-conversion-java")
include(":kernel-internal-base-utils")
include(":kernel-internal-core-calc")
include(":kernel-internal-core-codegen")
