RULE_HAS_NO_ERRORTEXT=The rule '%s' does not specify an error text for the language %s.

RULE_ERRORTEXT_WRONG=The rule '%s' specifies an incorrect error text for the language %s.

WRONG_ENCODING=The error text contains characters which are not valid. Only %s-characters are allowed.

INVALID_LINEBREAK=The error text contains a line break which is not valid.

WRONG_NUMBER_OF_DOLLARS=The error text contains an incorrect number of $ characters.

INVALID_CHARACTERS=The error text contains invalid characters. Line separators as well as control characters are not allowed.

INVALID_CONDITION=Error text with a parameter can only be checked for rules with valid rule conditions. Since the rule condition is invalid, the error text could not be checked.

NO_BASE_YEAR=Error text: The use of BaseYear is only allowed in model species with base year.

INVALID_PARAMETER=The error text parameter '%s' is not valid.

INVALID_PATH_SPEC=Error text: the parameter for the error '%s' is not allowed to use a path name.

INVALID_PATH_SPEC_IN_PARAMETER=Parameter '%s' is not allowed to use a path name.

INVALID_ROOT_GROUP=Rootgroup '%s' is not valid.

INVALID_ENTITY=The group or field '%s' is not valid.

INVALID_FIELD=The referenced field '%s' is either referenced wrongly or is not used in the rule condition.

INVALID_FIELD_IN_PARAMETER=Parameter '%s' references either a field name which is not valid or the field was referenced wrong.

INVALID_FIELD_Z=The referenced field '%s' has only a maximum of %d rows.

INVALID_FIELD_L=The rootgroup of the referenced field '%s' has only a max. lfd. Nr. of %d.

PARAM_INVALID_IN_NEW_WORLD=The parameter '%s' is not allowed to be used in A12 models.

ITER_PARAM_WITH_STARREFERENCE=The parameter '%s' is not allowed, because group '%s' is not referenced in the condition without an asterisk.

INVALID_GROUP=Error text: '%s' specifies a group name '%s', which is not valid.

PARAM_VALUE_WITH_STARREFERENCE=Parameter '%s' is not allowed, because field '%s' is not referenced in the condition without an asterisk.

RULEGROUP_IMMEDIATELY_BELOW_ROOT=The parameter '#RuleGroup' is not allowed in rules which are ordered right below the rootgroup.

NO_U_ITERATION=The parameter '#Usb' is not allowed, because the rule condition does not iterate USBs.

NO_Z_ITERATION=The parameter '#Zeile' is not allowed, because the rule condition does not iterate rows.

NO_VORDRUCKZEILE=The parameter '%s' references a field, which does not specify a rootgroup row.

INVALID_NO_VALUE_VALIDATION=For field '%s' is 'no value validation' defined and therefore the reference to its value is not allowed.

NO_CATEGORY=Category name of field '%s' may not be empty.

FIELD_NO_ENUM=Field '%s' is not of type enumeration and therefore an access to category values may not be specified.

INVALID_CATEGORY=Category '%s' for field '%s' is unknown.

FIELD_ERRORTEXT_WRONG=The field '%s' specifies an incorrect error text for the language %s:

ILLEGAL_SEMANTIC_INDEX=Invalid semantic index '%s'.

MVK_INDEX_FOR_ERROR_TEXT_INVALID=A semantic index '%s' can be used in an error text only if it is used in the rule condition in the same way.

INVALID_USE_OF_SEMANTIC_INDEX=Specifikation of semantic index '%s' is not valid, because the error can also occur, when no field of the specified repetition is filled.

INVALID_USE_OF_ITERATION_PARAM=The parameter '%s' is not allowed, because the rule specifies parallel iteration for this level and the error can also occur, when no field of the specified repetition is filled.

INVALID_HASH_LFDNR_FOR_PARALLEL_ITERATION=The parameter '%s' is not allowed, because the rule specifies parallel iteration. Use parameter '%s' instead.

INVALID_INDEX_FIELD=The field referenced in parameter '%s' is either no index-field, is referenced wrongly or is not used in the rule condition.

INVALID_INDEX_FIELD_PARAMETER=The index-field parameter '%s' does neither access the value nor the category-value.

INVALID_INDEX_FIELD_NONREP_ENUM=The index-field referenced '%s', which is on a non-repeatable group, has to be an enumeration and must define exactly one legal value which also has to be its s-value.

INVALID_INDEX_FIELD_REP=The index-fields referenced '%s' and '%s' either have to be repeatable and the rule condition specifies (parallel) iteration or both have to be non-repeatable.

INVALID_INDEX_FIELD_REP_ITER=The repeatable index-field '%s' may only be referenced, if the rule condition only specifies (parallel) iteration for it.

INVALID_INDEX_FIELD_ENUM_XML_VALUES=The index-fields referenced '%s' and '%s' do have different XML-values or the ordering thereof is different.

INVALID_INDEX_FIELD_ENUM_XML_TO_CAT=The index-fields referenced '%s' and '%s' do have different mappings between XML- and category-values.

INVALID_INDEX_FIELD_INCONSISTENT_TYPES=The index-fields referenced '%s' and '%s' have to be either both or none of type enumeration.

INVALID_INDEX_FIELD_ENUM_XML_TO_DISPLAY=The index-fields referenced '%s' and '%s' do have different mappings between XML- and display-values.

INVALID_INDEX_FIELD_AMBIGUOUS=The index-field parameter '%s' is not allowed for '%s', as there is more than one index field with this short name on the error field path.

INVALID_INDEX_FIELD_COMPOSED_INDEX=The index-field parameter '%s' is not allowed for '%s', as the index is composed from several fields.

ERROR_TEXT_PARAMETER_TOO_MANY_PARENT_GROUPS=Path specification '%s': The relative path specification contains too many upward steps.

ERROR_TEXT_FIELDNAME_NOT_UNIQUE=The field name '%s' is used multiple times in the model. Therefore, the short name does not suffice to reference the field. (Fields with the same name: %s)

ERROR_TEXT_PARAMETER=parameter
