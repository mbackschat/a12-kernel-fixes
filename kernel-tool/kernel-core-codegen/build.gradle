plugins {
    alias libs.plugins.kernelJavaConventions
    alias libs.plugins.lombok
}

description = "kernel-core-codegen"

dependencies {
    api libs.baseModelApi
    api project(':kernel-internal-base-utils')
    api project(':kernel-internal-core-codegen-base')
    api project(':kernel-internal-core-codegen-condition')
    api project(':kernel-internal-core-codegen-entities')
    api project(':kernel-internal-core-codegen-rules')
    api project(':kernel-internal-core-extmpspecifics')
    api project(':kernel-internal-core-parsetree-api')
    api libs.kernelCoreRuntimeApi
    api project(':kernel-internal-core-service')
    api project(':kernel-internal-core-tool-api')

    implementation project(':kernel-internal-core-calc')
    implementation project(':kernel-internal-core-codegen-meta-base')
    implementation project(':kernel-internal-core-parser')
    implementation project(':kernel-internal-core-utils')
    implementation libs.baseModelConsistency
    implementation libs.commonsLang3

    // the metamodel validators must _not_ be compile-time dependencies (runtimeOnly, access via reflection),
    // in order to enable the A12_KERNEL_BOOTSTRAP_VALIDATORS_DISABLE_MM_VALIDATION mechanism
    runtimeOnly libs.kernelMmCommonV2CodegenValidators


}