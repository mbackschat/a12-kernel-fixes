plugins {
    alias libs.plugins.kernelJavaConventions
    alias libs.plugins.lombok

}

description = "service facade for services commonly used by tools"


dependencies {
    api project(':kernel-internal-core-parser')
    api project(':kernel-internal-core-parsetree-api') // must be api because of MVKService
    api project(':kernel-internal-core-tool-api') // public methodensignaturen in ServiceFactory
