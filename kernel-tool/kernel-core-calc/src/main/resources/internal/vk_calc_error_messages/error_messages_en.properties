MVK_ERROR_WRONG_CALCULATED_FIELD=The calculated field '%s' doesn't match with the error field of the rule.

MVK_ERROR_RESTRICTED_CALCULATION_RULE=The iteration has to be non-restricted when using calculation rules.

MVK_ERROR_SEMANTIC_INDEX_OR_CATEGORY_FOR_ERRORFIELD=The calculated field must not specify a semantic index or a category access.

MVK_ERROR_REFERENCE_TO_CALCULATED_FIELD=The calculated field cannot be used in prerequisites and calculation functions.

MVK_ERROR_ITERATION_UNCHECKED=If the calculated field is repeatable, every partial calculation has to have values for its respective iteration.

MVK_ERROR_INVALID_COMPARISON=Partial calculations must end with an unequal or tolerance comparison of the calculated field with the calculation function.

MVK_ERROR_INVALID_ENUM_CALCULATION=Enumeration calculations are only allowed for assignments from constants, enumerations, and enumeration categories, which fit the enumeration values.

MVK_ERROR_COMPARISON_WITH_OR=The calculation comparison has to be separated from the prerequisite by an AND.

MVK_ERROR_EMPTY_PRECONDITION=Empty prerequisite is not allowed here.

MVK_ERROR_INVALID_LANGUAGE_FEATURE=Using predicate '%s' is prohibited in the calculation rules.

MVK_ERROR_INVALID_FIELD_GATE=The rule condition has to have the following pattern: FieldFilled(<CalculatedField>) AND ...

MVK_ERROR_WRONG_ROUNDING_MODE=When using exact calculation comparisons only the rounding mode 'exact' is allowed.

MVK_ERROR_INVALID_FIELDTYPE=When using tolerance comparisons with rounding mode 'Exact', the calculated field must exist and may only be of type 'Number'.

MVK_ERROR_CALC_CYCLE=The following calculated fields form a cycle via the rules listed in brackets: %s.

MVK_ERROR_INVALID_FIELDNAME=Calculated fields are not allowed to contain dots or colons: %s

MVK_CALCULATION_FIELD_AND_NO_CALCULATION_RULE=No calculation can be derived from rule '%s' for field '%s', but field '%s' is marked as calculated field.

MVK_ERROR_INDEX_AS_CALCULATED_FIELD=The calculated field '%s' must not be an index field.

MVK_GROUP_AS_CALCULATED_FIELD=The calculated field '%s' must not be a group.

MVK_CALC_INVALID_ACTION_TYPE=Only rules with action type 'error' may be defined as calculation rules.
