MVK_DYNENUM_INVALID_TYPE=The target field is of an invalid type. Only fields of type string without restriction, of type number without fractional digits or enumerations are allowed.

MVK_ERROR_WRONG_DYNENUM_FIELD=The target field '%s' does not correspond to the error field of the rule '%s'.

MVK_DYNENUM_OLD_WORLD=Dynamic enumerations are not allowed for non-A12-models.

MVK_DYNENUM_PARALLEL_ITERATION=Parallel iteration is not allowed in rules for dynamic enumerations.

MVK_DYNENUM_REPETITION_NOT_UNIQUE=RepetitionNotUnique cannot be used in rules for dynamic enumerations.

MVK_DYNENUM_INVALID_GATE=Rules for dynamic enumerations have to use the canonical form. After an optional safe guard statement, "FieldFilled(<targetfield>) And " must be specified followed by the list of calculation operations separated by "And".

MVK_INVALID_ITERATION=When calculating values for dynamic enumerations only simple iteration is allowed. Neither field expansion nor semantic index are allowed. The iteration of the target field must be consistent in the rule.

MVK_DYNENUM_INVALID_CALCOP=Rules for dynamic enumerations have to use the canonical form. The individual calculation operations for the values consist of a comparison of the target field value with the calculation function. Optionally, a negative precondition can be prepended with "Or".

MVK_DYNENUM_INVALID_CALCOP_OP=Rules for dynamic enumerations have to use the canonical form. The operation "!=" has to be used for the comparison of the target field and the calculation function. Alternatively, the consistency of the field may be checked using ValueNotConsistent.

MVK_ERROR_DYNENUM_FIELD_WITH_CATEGORY=Category access is not allowed for the target field of dynamic enumeration value calculation rules.

MVK_DYNENUM_INVALID_FIELD_REFERENCE=In preconditions or calculation functions operands may only be referenced if they are checked in the safe guard. '%s' is not a checked operand.

MVK_DYNENUM_INDEX_FIELD=Dynamic enumeration fields must not also be index fields.