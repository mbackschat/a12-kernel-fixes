plugins {
    alias libs.plugins.kernelJavaConventions
    alias libs.plugins.lombok
}

description = "Utilities used in validation. The module has dependencies to very low level external libraries only. In comparison to kernel-core-utils, kernel-core-base-utils may not depend on kernel-core-runtime."

dependencies {
    api project(':kernel-core-tool-api')
    api libs.baseModelConsistency

    implementation libs.commonsCollections4
    implementation libs.commonsLang3
    implementation libs.slf4jApi

    runtimeOnly libs.jacksonCore
    runtimeOnly libs.jacksonDatabind


}