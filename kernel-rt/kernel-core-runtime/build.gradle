plugins {
    alias libs.plugins.kernelJavaConventions
    alias libs.plugins.lombok
}

description = "contains the implementation of the predicates of the condition text language, of error handling, etc. and is used by generated code in JAVA and JavaScript"

dependencies {
    api libs.slf4jApi //should be kept for convenience, because our users should easily be able to use it
    api libs.kernelCoreCustomfieldtypeApi
    api libs.kernelCoreRuntimeApi
    api libs.commonsLang3

    api project(':kernel-conversion-java')

    implementation libs.slf4jApi

    // A12K-4377 dependency modelling: DocumentV2-based (de)serialization of the embedded dependency
    // model plus the generated typed views, used by the dependency runtime service. This is the
    // deliberate heavy-dependency consequence of the DocumentV2 usage.
    implementation project(':kernel-md-serializer')
    implementation libs.kernelMmDependencyModel1Typings
    runtimeOnly libs.kernelMmDependencyModel1NoneDmjsons

}

