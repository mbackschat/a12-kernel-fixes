#define the appenders
log4j.appender.consoleAppender=org.apache.log4j.ConsoleAppender

# now define the layout for the appender
log4j.appender.consoleAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.consoleAppender.layout.ConversionPattern=%-4r [%t] %-5p %c %x - %m%n

# now map our console appender as a root logger, means all log messages will go to this appender
log4j.rootLogger=ERROR, consoleAppender


# custom log for the cli (info/warn to System.out, error to System.err)
log4j.logger.com.mgmtp.a12.kernel.tool.migration.MigratorCli=INFO, cliAppender, cliErrorAppender

# log the MigratorCli with this logger only, prevents duplicated logging
log4j.additivity.com.mgmtp.a12.kernel.tool.migration.MigratorCli=false

log4j.appender.cliAppender=org.apache.log4j.ConsoleAppender
log4j.appender.cliAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.cliAppender.layout.ConversionPattern=%m%n
log4j.appender.cliAppender.filter.filter1=org.apache.log4j.varia.LevelRangeFilter
log4j.appender.cliAppender.filter.filter1.levelMin=INFO
log4j.appender.cliAppender.filter.filter1.levelMax=WARN
log4j.appender.cliAppender.filter.filter1.AcceptOnMatch=true

log4j.appender.cliErrorAppender=org.apache.log4j.ConsoleAppender
log4j.appender.cliErrorAppender.Target=System.err
log4j.appender.cliErrorAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.cliErrorAppender.layout.ConversionPattern=%m%n
log4j.appender.cliErrorAppender.filter.filter2=org.apache.log4j.varia.LevelRangeFilter
log4j.appender.cliErrorAppender.filter.filter2.levelMin=ERROR
log4j.appender.cliErrorAppender.filter.filter2.levelMax=ERROR
