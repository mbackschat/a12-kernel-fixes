A12_kernel_group_id=com.mgmtp.a12.kernel

# jdk config
java_language_version=21
java_language_version_for_rt_deps=21
java_toolchain_version=21

# junit parallel config
systemProp.junit.jupiter.execution.parallel.enabled=true
systemProp.junit.jupiter.execution.parallel.mode.default=concurrent
systemProp.junit.jupiter.execution.parallel.mode.classes.default=concurrent
systemProp.junit.jupiter.execution.parallel.config.strategy=dynamic



# gradle config
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# test config
testIgnoreFailuresProp=false

# setup for the include-build of those modules
a12.kernel.include.customfieldtype.api=true
a12.kernel.include.runtime.api=true
