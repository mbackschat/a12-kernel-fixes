plugins {
    alias libs.plugins.kernelJsConventions
}

def npmWorkingDir = file(".")

String osName = providers.systemProperty("os.name").get().toLowerCase()
project.ext.npm_executable = osName.contains("windows") ? "npm.cmd" : "npm"
def npm_groupName = "npm"

// This package is part of the root package.json workspaces, so the regular
// npm_install (root workspace install) provides dependencies for compile/lint.
// For packing we additionally need a non-hoisted install so `npm pack` can bundle
// the bundledDependencies from this package's own node_modules.
tasks.register('custom_npm_install', Exec) {
    group = npm_groupName
    workingDir npmWorkingDir

    // run the local bundling install only after the regular workspace-based build is
    // done, so compilation uses the hoisted workspace dependencies as usual
    mustRunAfter tasks.named('npm_assemble')

    inputs.file("${npmWorkingDir}/package.json")
    inputs.file("${npmWorkingDir}/package-lock.json")

    // the lockfile in node_modules can be used to identify if there are relevant changes,
    // it is not necessary to check the whole node_modules directory
    // see https://docs.npmjs.com/cli/v7/configuring-npm/package-lock-json#hidden-lockfiles
    outputs.file("${npmWorkingDir}/node_modules/.package-lock.json")

    // don't cache anything (node_modules etc.) as it is not enough to just get the package-lock from cache
    // see https://docs.gradle.org/current/javadoc/org/gradle/api/tasks/TaskOutputs.html#upToDateWhen-groovy.lang.Closure
    outputs.cacheIf { false }

    commandLine npm_executable, "install", "--no-workspaces", "--loglevel", "warn", "--no-progress"
}

tasks.named('npm_cyclonedx') {
    enabled = false
}

tasks.named('npm_pack') {
    dependsOn tasks.named('custom_npm_install')
}

description = "codemod for the kernel modules"
