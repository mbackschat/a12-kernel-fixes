# Root: console only
log4j.rootLogger=INFO, console

# Console Appender configuration
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.threshold=INFO
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c] - %m%n

# File Appender - attached only to the BatchDocumentModelExpander logger
log4j.logger.com.mgmtp.a12.kernel.md.facade.cli.BatchDocumentModelExpander=INFO, file
log4j.additivity.com.mgmtp.a12.kernel.md.facade.cli.BatchDocumentModelExpander=false

log4j.appender.file=org.apache.log4j.FileAppender
log4j.appender.file.threshold=DEBUG
log4j.appender.file.File=logs/output.log
log4j.appender.file.Append=true
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c] - %m%n