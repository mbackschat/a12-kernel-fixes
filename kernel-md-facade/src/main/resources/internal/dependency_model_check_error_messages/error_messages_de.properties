MVK_MALFORMED_DEPENDENT_ENTITY=Die für '%s' konfigurierten Triggerfelder können nicht gelesen werden: '%s'. Geben Sie ein oder mehrere Triggerfelder an, getrennt durch ein Semikolon (';'). Auf ein Triggerfeld darf ein Komma (',') mit einem Indexwert folgen. Beispiel: /Haushalt/Person; /Haushalt/Einkommen, 2

MVK_MALFORMED_DEPENDENT_ENTITY_INDEX=Bei einem für '%s' konfigurierten Triggerfeld folgt auf ein Komma kein Indexwert: '%s'. Ergänzen Sie den Indexwert (Beispiel: /Haushalt/Einkommen, 2) oder entfernen Sie das Komma.

MVK_TRIGGER_FIELD_NOT_ANNOTATED=Die abhängige Entität '%s' referenziert '%s' als Triggerfeld, aber dieses Feld ist nicht als Triggerfeld markiert. Ergänzen Sie die TriggerField-Annotation daran oder korrigieren Sie die Referenz.

MVK_INVALID_TRIGGER_FIELD=Das Triggerfeld '%s' existiert nicht im Dokumentmodell. Geben Sie den vollständigen Pfad eines vorhandenen Feldes an, zum Beispiel /Haushalt/Einkommen.

MVK_INVALID_DEPENDENT_ENTITY=Das abhängige Feld oder die abhängige Gruppe '%s' existiert nicht im Dokumentmodell. Geben Sie den vollständigen Pfad eines vorhandenen Feldes oder einer vorhandenen Gruppe an.

MVK_INVALID_RULE=Die Regel '%s', für die eine alternative Fehlermeldung konfiguriert ist, existiert nicht im Dokumentmodell. Geben Sie den vollständigen Pfad einer vorhandenen Regel an.

MVK_INVALID_INDIRECT_REFERENCE=Die abhängige Entität '%s' ist bereits in der abhängigen Gruppe '%s' desselben Triggerfeldes enthalten. Entfernen Sie den überflüssigen Eintrag.

MVK_INVALID_INDEX_FIELD=Für die abhängige Entität '%s' ist ein Indexwert konfiguriert, aber keine Gruppe auf ihrem Pfad besitzt ein Indexfeld. Entfernen Sie den Indexwert oder fügen Sie der wiederholbaren Gruppe, die der Index auswählt, ein Indexfeld hinzu.

MVK_INVALID_INDEX_VALUE=Der Indexwert '%s', der für die abhängige Entität '%s' konfiguriert ist, ist kein zulässiger Wert des Indexfeldes '%s'. Geben Sie einen der zulässigen Werte dieses Indexfeldes an.

MVK_MULTIPLE_INDEX_FIELDS=Für '%s' gibt es mehr als eine Gruppe mit einem Indexfeld.

MVK_INVALID_LANGUAGE=Die Sprache '%s' einer alternativen Fehlermeldung der Regel '%s' ist keine unterstützte Sprache des Dokumentmodells. Verwenden Sie eine der Sprachen des Modells.

MVK_INVALID_INDEX_FOR_TRIGGER=Das Triggerfeld '%s' hat '%s' als abhängige Entität mit einem Indexwert, aber zwischen dem Triggerfeld und der Gruppe des Indexfeldes liegt eine wiederholbare Gruppe. Das ist nicht zulässig: Entfernen Sie die dazwischenliegende Wiederholung oder den Indexwert.

MVK_INVALID_ALTERNATIVE_MESSAGE_PARAMETER=Die alternative Fehlermeldung der Regel '%s' verweist auf den Parameter '%s'. Alternative Fehlermeldungen dürfen keine Parameter enthalten, da sie den Text ersetzen, nachdem die Parameter bereits eingesetzt wurden. Entfernen Sie den Parameter.
