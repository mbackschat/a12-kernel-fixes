MVK_MALFORMED_DEPENDENT_ENTITY=The trigger fields configured for '%s' cannot be read: '%s'. Enter one or more trigger fields, separated by a semicolon (';'). A trigger field may be followed by a comma (',') and an index value. Example: /Household/Person; /Household/Income, 2

MVK_MALFORMED_DEPENDENT_ENTITY_INDEX=A trigger field configured for '%s' has a comma but no index value after it: '%s'. Add the index value (example: /Household/Income, 2) or remove the comma.

MVK_TRIGGER_FIELD_NOT_ANNOTATED=The dependent entity '%s' references '%s' as a trigger field, but that field is not marked as a trigger field. Add the TriggerField annotation to it, or fix the reference.

MVK_INVALID_TRIGGER_FIELD=The trigger field '%s' does not exist in the document model. Enter the full path of an existing field, for example /Household/Income.

MVK_INVALID_DEPENDENT_ENTITY=The dependent field or group '%s' does not exist in the document model. Enter the full path of an existing field or group.

MVK_INVALID_RULE=The rule '%s' that an alternative message is configured for does not exist in the document model. Enter the full path of an existing rule.

MVK_INVALID_INDIRECT_REFERENCE=The dependent entity '%s' is already contained in the dependent group '%s' of the same trigger field. Remove the redundant entry.

MVK_INVALID_INDEX_FIELD=An index value is configured for the dependent entity '%s', but no group on its path has an index field. Remove the index value, or add an index field to the repeatable group that the index selects.

MVK_INVALID_INDEX_VALUE=The index value '%s' configured for the dependent entity '%s' is not an allowed value of the index field '%s'. Enter one of the allowed values of that index field.

MVK_MULTIPLE_INDEX_FIELDS=For '%s' there is more than one group with an index field.

MVK_INVALID_LANGUAGE=The language '%s' of an alternative message of rule '%s' is not a supported language of the document model. Use one of the model's languages.

MVK_INVALID_INDEX_FOR_TRIGGER=The trigger field '%s' has '%s' as a dependent entity with an index value, but a repeatable group lies between the trigger field and the group of the index field. This is not valid: remove the intervening repetition or the index value.

MVK_INVALID_ALTERNATIVE_MESSAGE_PARAMETER=The alternative message of rule '%s' references the parameter '%s'. Alternative messages must not contain parameters, because they replace the text after the parameters have already been inserted. Remove the parameter.
