tasks.register('make_internal_BatchDocumentModelExpanderCli', Jar) { // only temporary and for testing, can be removed soon-ish
    dependsOn configurations.runtimeClasspath
    dependsOn sourceSets.main.output
    from(sourceSets.main.resources) // must be first so project's log4j.properties wins over dependency JARs
    from {
        sortAndConvertClasspathEntriesForFatJar(
                sourceSets.main.output
                        + configurations.runtimeClasspath
                        + configurations.cliResources
        )
    }
    duplicatesStrategy DuplicatesStrategy.EXCLUDE
    archiveClassifier = "internal_BatchDocumentModelExpander"
    manifest {
        attributes "Main-Class": "${kernelGroupId}.md.facade.internal.cli.BatchDocumentModelExpander"
    }
}

tasks.register('make_MappingModelCodegenCli', Jar) {
    dependsOn configurations.runtimeClasspath
    dependsOn sourceSets.main.output
    from {
        sortAndConvertClasspathEntriesForFatJar(
                sourceSets.main.output
                        + configurations.runtimeClasspath
        )
    }
    duplicatesStrategy DuplicatesStrategy.EXCLUDE
    archiveClassifier = "MappingCodeGenerator-CLI"

    manifest {
        attributes "Main-Class": "${kernelGroupId}.mapping.cli.MappingModelCodegenCLI"
    }
}

tasks.register('make_MigratorCli', Jar) {
    dependsOn configurations.runtimeClasspath
    dependsOn sourceSets.main.output
    from(sourceSets.main.resources) // must be first so project's log4j.properties wins over dependency JARs
    from {
        sortAndConvertClasspathEntriesForFatJar(
                sourceSets.main.output
                        + configurations.runtimeClasspath
                        + configurations.cliResources
        )
    }
    duplicatesStrategy DuplicatesStrategy.EXCLUDE
