tasks.named('npm_compile') { Task it ->
    addBuildTaskDependency(it, ':kernel-core-runtime-api-ts', ':kernel-core-runtime-ts')
}


tasks.named('assemble') {
    dependsOn tasks.named('make_internal_BatchDocumentModelExpanderCli')
    dependsOn tasks.named('make_MappingModelCodegenCli')
    dependsOn tasks.named('make_MigratorCli')
    dependsOn tasks.named('make_TypedAccessorCodegenCli')
}


artifacts {
    typedAccessorGeneratorCLIConfig make_TypedAccessorCodegenCli
}

publishing {
    publications {
        maven(org.gradle.api.publish.maven.MavenPublication) {
            // already includes sources jar and javadoc jar
            artifact make_MappingModelCodegenCli
            artifact make_MigratorCli
            artifact make_TypedAccessorCodegenCli
        }
    }
}
