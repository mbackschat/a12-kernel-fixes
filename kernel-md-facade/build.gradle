tasks.register('make_TypedAccessorCodegenCli', Jar) {
    dependsOn configurations.runtimeClasspath
    dependsOn sourceSets.main.output
    from {
        sortAndConvertClasspathEntriesForFatJar(
                sourceSets.main.output
                        + configurations.runtimeClasspath
        )
    }

    duplicatesStrategy DuplicatesStrategy.EXCLUDE
    archiveClassifier = "typed-accessor-gen-cli"

    manifest {
        attributes "Main-Class": "${kernelGroupId}.md.document.typed_accessor_gen.TypedAccessorGenerator"
    }
