
plugins {
    alias libs.plugins.kernelJavaConventions


}

description = "library and cli for generating typed accessor classes for documents"

configurations {
    typedAccessorGeneratorCLIConfig

}


dependencies {
    api project(":kernel-md-model-api")

    implementation project(':kernel-core-base-utils')
    implementation project(':kernel-md-a12internal')
    implementation project(':kernel-md-combination-model')
    implementation project(":kernel-md-serializer")
    implementation libs.baseModelApi
    implementation libs.baseModelConsistency
    implementation libs.commonsCli
    implementation libs.commonsLang3
    implementation libs.commonsText
    implementation libs.st4

    compileOnly project(":kernel-md-util")
    compileOnly libs.baseModelUtils


}

tasks.register('make_GeneratorCli', Jar) {
    dependsOn configurations.runtimeClasspath
    dependsOn sourceSets.main.output
    from {
        sortAndConvertClasspathEntriesForFatJar(
                sourceSets.main.output
                        + configurations.runtimeClasspath
        )
    }

    duplicatesStrategy DuplicatesStrategy.EXCLUDE
    archiveClassifier = "TypedAccessorGenerator-CLI"

    manifest {
        attributes "Main-Class": "${A12_kernel_group_id}.md.document.typed_accessor_gen.TypedAccessorGenerator"
    }
}

tasks.named('assemble') {
    dependsOn(tasks.named('make_GeneratorCli'))
}


artifacts {
    typedAccessorGeneratorCLIConfig make_GeneratorCli
}

publishing {
    publications {
        maven(MavenPublication) {
            // already includes sources jar and javadoc jar
            artifact make_GeneratorCli
        }
    }
}
