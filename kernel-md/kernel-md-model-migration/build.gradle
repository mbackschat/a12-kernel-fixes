plugins {
    alias libs.plugins.kernelJavaConventions
    alias libs.plugins.lombok
}

description = "Implementation of migration services for document model files"

configurations {
    testClasses {
        canBeConsumed = true
        canBeResolved = false
        extendsFrom testImplementation
    }
}

dependencies {
    api project(':kernel-internal-base-utils')
    api project(':kernel-internal-core-tool-api')
    api project(':kernel-md-documentmodel')
    api libs.jacksonAnnotations
    api libs.jacksonDatabind
    api libs.slf4jApi

    compileOnly libs.baseModelUtils // Only annotations

    implementation project(':kernel-internal-core-parser')
    implementation project(':kernel-internal-core-service')
    implementation project(':kernel-md-serializer')
    implementation libs.baseModelApi
    implementation libs.commonsLang3
    implementation libs.jacksonCore

}

artifacts {
    testClasses(sourceSets.test.output.classesDirs.first()) {
        builtBy tasks.named('testClasses')
    }
}