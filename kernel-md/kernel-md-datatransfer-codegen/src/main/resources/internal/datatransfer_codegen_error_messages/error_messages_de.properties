SOURCE_HAS_MULTIPLE_ROOTGROUPS=Quelle '%s' hat mehr als einen Vordruck %s, aber Quellen müssen genau einen Vordruck enthalten, es sei denn die Quelle verwendet "includeLevel=MODEL_ROOT"
SOURCE_ROOTGROUP_REPEATABLE=Quelle '%s' hat den wiederholbaren Vordruck '%s', aber der Vordruck einer Quelle darf nicht wiederholbar sein, es sei denn die Quelle verwendet "includeLevel=MODEL_ROOT"
NO_COMMON_LOCALES_BASE=Es gibt kein gemeinsames Locale, das von der Ziel-DV und allen Quellen unterstützt wird. Unterstützte Locales: Ziel-DV: %s; Quell-DVs: %s
NO_COMMON_LOCALES_PRECOMP=Es gibt kein gemeinsames Locale, das von der Ziel-DV, dem Vorberechnungs-Fragment und allen Quellen unterstützt wird. Unterstützte Locales: Ziel-DV: %s; Vorberechnungs-Fragment: %s; Quell-DVs: %s
PROBLEM_DURING_PRECOMPUTATION_DM_CREATION=Bei der Erzeugung des Vorberechungsmodells ist ein Fehler aufgetreten: %s
NONERROR_MESSAGE_DURING_PRECOMPUTATION_DM_CREATION=Bei der Erzeugung des Vorberechungsmodells ist eine Meldung aufgetreten: %s
DIFFERENT_TIMEZONES=Alle referenzierten Dokumentenmodelle (DMs) müssen die gleiche Zeitzone haben: %s
SOURCE_NAME_CLASHES_WITH_TARGET_ROOTGROUP=Quellname darf nicht gleich einem Vordrucknamen aus dem Ziel sein: %s
PRECOMPUTATION_FIELDS_IN_TARGET=Folgende Vorberechnungen haben ein berechnetes Feld, das innerhalb eines Ziel-Vordrucks liegt: %s
PRECOMP_FRAGMENT_OVERLAPS_TARGET=Das Vorberechnungsfragment überlappt mit Vordrucken aus dem Ziel: %s

WARN_NOT_ALL_TARGET_LOCALES_SUPPORTED_BASEDM=Das Mapping unterstützt nur einen Teil der vom Ziel unterstützten Locales. Folgende Locales können nicht unterstützt werden, da sie nicht in allen Quellen unterstützt werden: %s
WARN_NOT_ALL_TARGET_LOCALES_SUPPORTED_PRECOMP_DM=Das Mapping unterstützt nur einen Teil der vom Ziel unterstützten Locales. Folgende Locales können nicht unterstützt werden, da sie vom Vorberechnungs-Fragment nicht unterstützt werden: %s
WARN_PRECOMP_FRAGMENT_HAS_DIFFERENT_DECIMAL_SEPARATOR=Der im Vorberechnungsfragment konfigurierte Dezimaltrenner ('%s') weicht vom Dezimaltrenner des Ziels ('%s') ab. (Die Vorberechnungen werden immer mit dem Dezimaltrenner des Ziels durchgeführt).
SOURCE_ALLOWS_UNSUPPORTED_CHARACTERS=Der Zeichensatz der Quelle '%s' erlaubt Zeichen, die vom Ziel '%s' nicht unterstützt werden.

INFO_NO_PRECOMPUTATION_FRAGMENT_SPECIFIED=Im Mappingmodel wurde kein Vorberechnungsfragment spezifiziert.
