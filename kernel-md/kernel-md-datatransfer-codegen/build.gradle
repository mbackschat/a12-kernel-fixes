
plugins {
    alias libs.plugins.kernelJavaConventions
    alias libs.plugins.lombok


}

description = "Implementation of datatransfer (mapping) code generation"

dependencies {
    annotationProcessor libs.lombok
    testAnnotationProcessor libs.lombok

    api libs.baseModelConsistency
    api libs.kernelMmMappingModel2Typings // api because typed accessors are used in (a12-facing) API methods
    api libs.kernelMmStructuralMappingModel1Typings
    api project(":${A12_kernel_runtime_artifact_id()}")
    api project(':kernel-core-base-utils')
    api project(':kernel-core-codegen')
    api project(':kernel-core-codegen-base')
    api project(':kernel-core-tool-api')
    api project(':kernel-md-a12internal')
    api project(':kernel-md-model')
    api project(':kernel-md-model-api')
    api project(':kernel-md-runtime-api')
    api project(':kernel-md-structuralmapping-tool')
    api project(':kernel-md-structuralmapping-codegen')

    compileOnly libs.baseModelUtils // Only annotations

    implementation libs.kernelMmMappingModel2CodegenValidators // for the validator
    implementation libs.baseModelApi
    implementation libs.commonsCli
    implementation libs.commonsLang3
    implementation project(":kernel-md-runtime-service")
    implementation project(':kernel-md-document-api')
    implementation project(':kernel-md-document-v2')
    implementation project(':kernel-md-join')
    implementation project(':kernel-md-serializer')
    // initially only for codegen CLI, but it would also make sense to delegate the assembly of the precomputation DM (and base DM) to the combination model logic in the future
    implementation project(':kernel-md-combination-model')

    runtimeOnly libs.kernelMmMappingModel2NoneDmjsons
    runtimeOnly libs.kernelMmMappingModel2CodegenDmjsons


}


tasks.register('make_GeneratorCli', Jar) {
    dependsOn configurations.runtimeClasspath
    dependsOn sourceSets.main.output
    from {
        sortAndConvertClasspathEntriesForFatJar(
                sourceSets.main.output
                        + configurations.runtimeClasspath
        )
    }
    duplicatesStrategy DuplicatesStrategy.EXCLUDE
    archiveClassifier = "MappingCodeGenerator-CLI"

    manifest {
        attributes "Main-Class": "${A12_kernel_group_id}.mapping.cli.MappingModelCodegenCLI"
    }
}

tasks.named('assemble') {
    dependsOn(tasks.named('make_GeneratorCli'))
}


publishing {
    publications {
        maven(MavenPublication) {
            artifact make_GeneratorCli
        }
    }
}
