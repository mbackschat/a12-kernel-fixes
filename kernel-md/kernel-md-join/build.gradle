plugins {
    alias libs.plugins.kernelJavaConventions
    alias libs.plugins.lombok
}

dependencies {
    api project(":kernel-core-base-utils")
    api project(':kernel-core-tool-api')
    api project(":kernel-md-a12internal")
    api project(':kernel-md-document-v2')
    api project(":kernel-md-model")
    api project(':kernel-md-model-api')

    api libs.baseModelApi
    api libs.baseModelConsistency
    api libs.jsr305
    api libs.kernelMmSelectionModel2Typings
    api libs.kernelCtSelection1Typings

    compileOnly libs.baseModelUtils // for @Experimental and @OnlyForUsage in generated accessors

    implementation project(":kernel-core-calc")
    implementation libs.commonsLang3
    implementation libs.jacksonCore
    implementation libs.jacksonDatabind
    implementation libs.kernelCoreRuntimeApi
    implementation project(":kernel-core-facade")
    implementation project(":kernel-core-parser")
    implementation project(":kernel-md-runtime-api")
    implementation project(":kernel-md-runtime-service")
    implementation project(":kernel-md-serializer")
    implementation libs.kernelCtSelection1Typings // note: probably inherited via kernelMmSelectionModel2Typings anyway
    implementation libs.kernelMmSelectionModel2CodegenValidators
    implementation libs.kernelMmSelectionModel2NoneDmjsons


}

// currently only for local manual build and test. in order to also deploy this, have a look at e.g. the kernel-md-facade build.gradle for a config example
tasks.register('make_DMAdderCLI', Jar) {
    dependsOn configurations.testRuntimeClasspath
    from sourceSets.main.output
    from sourceSets.test.output
    from {
        configurations.testRuntimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }

    duplicatesStrategy DuplicatesStrategy.EXCLUDE
    archiveClassifier = "DMAdderCLI"
    manifest {
        attributes "Main-Class": "com.mgmtp.a12.kernel.md.model.a12internal.services.join.cli.DMAdderCLI"
    }
}
