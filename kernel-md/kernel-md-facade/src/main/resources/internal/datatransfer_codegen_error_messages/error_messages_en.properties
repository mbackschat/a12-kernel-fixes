SOURCE_HAS_MULTIPLE_ROOTGROUPS=Source '%s' has multiple root groups %s, but sources must have exactly one root group, unless the source uses "includeLevel=MODEL_ROOT"
SOURCE_ROOTGROUP_REPEATABLE=Source '%s' has the repeatable root group '%s', but the root group of a source must not be repeatable, unless the source uses "includeLevel=MODEL_ROOT"
NO_COMMON_LOCALES_BASE=No common locale is supported by the target DM and all sources. Supported locales: target-DM: %s; source-DMs: %s
NO_COMMON_LOCALES_PRECOMP=No common locale is supported by the target DM, the precomputation fragment and all sources. Supported locales: target-DM: %s; precomputation-fragment: %s; source-DMs: %s
PROBLEM_DURING_PRECOMPUTATION_DM_CREATION=Error while creating the precomputation model: %s
NONERROR_MESSAGE_DURING_PRECOMPUTATION_DM_CREATION=Notification while creating the precomputation model: %s
DIFFERENT_TIMEZONES=All DMs must have the same time zone, but got %s
SOURCE_NAME_CLASHES_WITH_TARGET_ROOTGROUP=Source name must not be equal to the name of a root group in the target: %s
PRECOMPUTATION_FIELDS_IN_TARGET=The following precomputations have a calculated field that is inside or below a target group: %s
PRECOMP_FRAGMENT_OVERLAPS_TARGET=The precomputation fragment overlaps with root groups of the target: %s

WARN_NOT_ALL_TARGET_LOCALES_SUPPORTED_BASEDM=The mapping only supports a subset of the target's supported locales. The following locales are not supported, because not all sources support them: %s
WARN_NOT_ALL_TARGET_LOCALES_SUPPORTED_PRECOMP_DM=The mapping only supports a subset of the target's supported locales. The following locales are not supported, because the precomputation fragment does not support them: %s
WARN_PRECOMP_FRAGMENT_HAS_DIFFERENT_DECIMAL_SEPARATOR=The precomputation fragment has a decimal separator ('%s') that differs from the decimal separator of the target ('%s'). (Precomputations always use the decimal separator of the target).
SOURCE_ALLOWS_UNSUPPORTED_CHARACTERS=The character set of source '%s' allows characters that are not supported by the target '%s'.

INFO_NO_PRECOMPUTATION_FRAGMENT_SPECIFIED=The mapping model does not specify a precomputation fragment.
