tasks.register('make_internal_BatchDocumentModelExpanderCli', Jar) { // only temporary and for testing, can be removed soon-ish
    dependsOn configurations.runtimeClasspath
    dependsOn sourceSets.main.output
    from(sortAndConvertClasspathEntriesForFatJar(sourceSets.main.resources)) // must be first so project's log4j.properties wins over dependency JARs
    from {
        sortAndConvertClasspathEntriesForFatJar(
                sourceSets.main.output
                        + configurations.runtimeClasspath
                        + configurations.cliResources
        )
    }
    duplicatesStrategy DuplicatesStrategy.EXCLUDE
    archiveClassifier = "internal_BatchDocumentModelExpander"
    manifest {
        attributes "Main-Class": "${A12_kernel_group_id}.md.facade.internal.cli.BatchDocumentModelExpander"
    }
}

tasks.register('make_MappingModelCodegenCli', Jar) {
    dependsOn configurations.runtimeClasspath
    dependsOn sourceSets.main.output
    from {
        sortAndConvertClasspathEntriesForFatJar(
                sourceSets.main.output
                        + configurations.runtimeClasspath
        )
    }
    duplicatesStrategy DuplicatesStrategy.EXCLUDE
    archiveClassifier = "MappingCodeGenerator-CLI"

    manifest {
        attributes "Main-Class": "${A12_kernel_group_id}.mapping.cli.MappingModelCodegenCLI"
    }
}

tasks.register('make_MigratorCli', Jar) {
    dependsOn configurations.runtimeClasspath
    dependsOn sourceSets.main.output
    from(sourceSets.main.resources) // must be first so project's log4j.properties wins over dependency JARs
    from {
        sortAndConvertClasspathEntriesForFatJar(
                sourceSets.main.output
                        + configurations.runtimeClasspath
                        + configurations.cliResources
        )
    }
    duplicatesStrategy DuplicatesStrategy.EXCLUDE
    archiveClassifier = "migrator-cli"
    manifest {
        attributes "Main-Class": "${A12_kernel_group_id}.tool.migration.MigratorCli"
    }
}

tasks.register('make_TypedAccessorCodegenCli', Jar) {
    dependsOn configurations.runtimeClasspath
    dependsOn sourceSets.main.output
    from {
        sortAndConvertClasspathEntriesForFatJar(
                sourceSets.main.output
                        + configurations.runtimeClasspath
        )
    }

    duplicatesStrategy DuplicatesStrategy.EXCLUDE
    archiveClassifier = "typed-accessor-gen-cli"

    manifest {
        attributes "Main-Class": "${A12_kernel_group_id}.md.document.typed_accessor_gen.TypedAccessorGenerator"
    }
}

tasks.named('npm_compile') { Task it ->
    addBuildTaskDependency(it, ':kernel-core-runtime-api-ts', ':kernel-core-runtime-ts')
}

tasks.named('assemble') {
    dependsOn tasks.named('make_internal_BatchDocumentModelExpanderCli')
    dependsOn tasks.named('make_MappingModelCodegenCli')
    dependsOn tasks.named('make_MigratorCli')
    dependsOn tasks.named('make_TypedAccessorCodegenCli')
}


artifacts {
    typedAccessorGeneratorCLIConfig make_TypedAccessorCodegenCli
}

publishing {
    publications {
        maven(org.gradle.api.publish.maven.MavenPublication) {
            // already includes sources jar and javadoc jar
            artifact make_MappingModelCodegenCli
            artifact make_MigratorCli
            artifact make_TypedAccessorCodegenCli
        }
    }
}